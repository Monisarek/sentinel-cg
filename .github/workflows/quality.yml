name: Quality gates

on:
  pull_request:
  push:
    branches: [build, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python environment
        run: python -m pip check
      - name: Run offline backend regression and evidence checks
        run: python -B -m unittest discover -s tests -v
      - name: Enforce English-only public source
        run: python -B -m scripts.check_english

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - name: Run frontend tests
        run: npm test
        working-directory: apps/web
      - name: Run TypeScript check and production build
        run: npm run build
        working-directory: apps/web
